server:
  port: ${ORDER_SERVICE_PORT:8084}

spring:
  datasource:
    url: jdbc:mysql://localhost:3307/restoflow?allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    locations: classpath:db/migration
    table: flyway_schema_history_order
    baseline-on-migrate: true
    baseline-version: 0
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    from: ${MAIL_FROM:}

logging:
  level:
    com.restoflow.order: DEBUG   # use your real base package