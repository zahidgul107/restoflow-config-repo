server:
  port: ${IDENTITY_SERVICE_PORT:8081}

spring:
  datasource:
    url: jdbc:mysql://localhost:3307/restoflow?allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry-minutes: 15
    refresh-token-expiry-days: 30

logging:
  level:
    com.restoflow.identity: DEBUG